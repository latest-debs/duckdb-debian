# Package definition for duckdb

package_name: duckdb
github_repo: duckdb/duckdb
artifact_format: zip
description: "DuckDB is an analytical in-process SQL database management system"

# duckdb only publishes amd64/arm64 Linux builds, and each release also
# contains libduckdb-* and static-libs-* assets that match the same
# architecture patterns as duckdb_cli-* - auto-discovery would be
# ambiguous (could pick a shared library instead of the CLI binary), so
# release patterns are pinned explicitly here.
architectures:
  amd64:
    release_pattern: "duckdb_cli-linux-amd64.zip"
  arm64:
    release_pattern: "duckdb_cli-linux-arm64.zip"
